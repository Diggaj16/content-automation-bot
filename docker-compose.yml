# ─────────────────────────────────────────────────────────────────────────────
# Growthvine Capital — Content Automation Stack
#
# Services:
#   postgres — Postgres + pgvector (self-hosted, replaces Supabase)
#   redis    — arq job queue
#   api      — FastAPI server (uvicorn)
#   worker   — unified arq worker (all agent tasks on arq:default)
#   frontend — Next.js admin panel
#
# Usage:
#   docker compose up --build          # build + start all
#   docker compose up --build -d       # detached
#   docker compose logs -f worker      # tail worker logs
#   docker compose down -v             # stop + remove volumes
#
# First run only — postgres starts empty, schema isn't auto-created:
#   docker compose exec api alembic upgrade head
#   docker compose exec api python scripts/seed.py
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Postgres ──────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=contentautomation
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI backend ────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/contentautomation
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
      # PLAYWRIGHT_BROWSER_CHANNEL is intentionally unset — Docker uses bundled Chromium.
      # login_site_task (headless=False) won't work in Docker — run that on local machine.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - browser_sessions:/root/.config/contentautomation/browser_sessions
    # Chromium needs shared memory even in the API container (login_site_task)
    shm_size: "512m"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Unified arq worker ────────────────────────────────────────────────────
  # Single worker handles all agent types on arq:default queue.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      [
        "python", "-m", "arq",
        "app.queue.worker.WorkerSettings"
      ]
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/contentautomation
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - browser_sessions:/root/.config/contentautomation/browser_sessions
    shm_size: "1gb"

  # ── Next.js frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      - BACKEND_URL=http://api:8000
      # If backend/.env sets API_KEY, frontend/.env.local MUST set a matching
      # BACKEND_API_KEY or every proxied request will 403. See .env.example in
      # both backend/ and frontend/.
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  browser_sessions: