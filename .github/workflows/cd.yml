name: CD

# Runs only after CI succeeds on master. Builds + pushes images to ECR, then
# tells the EC2 instance (via SSM — no open SSH port, no stored SSH keys) to
# pull the new images and restart the stack.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    # workflow_run's `branches` filter matches on a PR's *base* branch too, so
    # without the explicit event check a PR targeting master would also
    # trigger a deploy of its (unreviewed) head commit. Restrict to actual
    # pushes to master.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
            repo: content-automation-backend
          - name: frontend
            context: frontend
            repo: content-automation-frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ matrix.repo }}:${{ github.event.workflow_run.head_sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ matrix.repo }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy via SSM
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"

          COMMANDS=$(jq -n \
            --arg dir "$DEPLOY_DIR" \
            --arg region "$AWS_REGION" \
            --arg registry "$REGISTRY" \
            --arg tag "$IMAGE_TAG" \
            '[
              "set -e",
              ("cd " + $dir),
              ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $registry),
              ("echo ECR_REGISTRY=" + $registry + " > .env"),
              ("echo IMAGE_TAG=" + $tag + " >> .env"),
              "docker compose -f docker-compose.prod.yml pull",
              "docker compose -f docker-compose.prod.yml up -d",
              "docker image prune -f"
            ]')
          PARAMS=$(jq -n --argjson commands "$COMMANDS" '{commands: $commands}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy content-automation ${IMAGE_TAG}" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" --output text)

          echo "SSM command: $COMMAND_ID"

          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "status: $STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
                exit 1 ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for deploy command"
          exit 1
