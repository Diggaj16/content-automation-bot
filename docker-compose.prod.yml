# ─────────────────────────────────────────────────────────────────────────────
# Growthvine Capital — Content Automation Stack (PRODUCTION)
#
# Same topology as docker-compose.yml, but pulls pre-built images from ECR
# instead of building locally. Used on the EC2 deploy target.
#
# Requires a .env file alongside this one (not committed) with:
#   ECR_REGISTRY=<account-id>.dkr.ecr.<region>.amazonaws.com
#   IMAGE_TAG=latest
#
# Usage on the server:
#   aws ecr get-login-password --region <region> | docker login --username AWS --password-stdin $ECR_REGISTRY
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  # NOTE: change POSTGRES_PASSWORD before relying on this in real production —
  # the default below is fine for getting the stack running, not for a public IP.
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=contentautomation
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    image: ${ECR_REGISTRY}/content-automation-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend.env
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/contentautomation
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - browser_sessions:/root/.config/contentautomation/browser_sessions
    shm_size: "512m"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  worker-research:
    image: ${ECR_REGISTRY}/content-automation-backend:${IMAGE_TAG:-latest}
    command: ["python", "-m", "arq", "app.queue.research_worker.ResearchWorkerSettings"]
    restart: unless-stopped
    env_file:
      - ./backend.env
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/contentautomation
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - browser_sessions:/root/.config/contentautomation/browser_sessions
    shm_size: "1gb"

  worker-scoring:
    image: ${ECR_REGISTRY}/content-automation-backend:${IMAGE_TAG:-latest}
    command: ["python", "-m", "arq", "app.queue.scoring_worker.ScoringWorkerSettings"]
    restart: unless-stopped
    env_file:
      - ./backend.env
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/contentautomation
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-creation:
    image: ${ECR_REGISTRY}/content-automation-backend:${IMAGE_TAG:-latest}
    command: ["python", "-m", "arq", "app.queue.creation_worker.CreationWorkerSettings"]
    restart: unless-stopped
    env_file:
      - ./backend.env
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/contentautomation
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-publishing:
    image: ${ECR_REGISTRY}/content-automation-backend:${IMAGE_TAG:-latest}
    command: ["python", "-m", "arq", "app.queue.publishing_worker.PublishingWorkerSettings"]
    restart: unless-stopped
    env_file:
      - ./backend.env
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/contentautomation
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-analytics:
    image: ${ECR_REGISTRY}/content-automation-backend:${IMAGE_TAG:-latest}
    command: ["python", "-m", "arq", "app.queue.analytics_worker.AnalyticsWorkerSettings"]
    restart: unless-stopped
    env_file:
      - ./backend.env
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/contentautomation
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ${ECR_REGISTRY}/content-automation-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./frontend.env
    environment:
      - BACKEND_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  browser_sessions:
