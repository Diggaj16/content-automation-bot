[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-automation-backend"
version = "0.2.0"
description = "Indian finance content automation backend"
requires-python = ">=3.11"
dependencies = [
    # Database
    "supabase>=2.3.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Task queue
    "arq>=0.26.1",
    "redis>=5.0.0,<6",

    # LLM
    "anthropic>=0.90.0",
    "langchain-anthropic>=0.2.0",
    "langgraph>=0.2.0",

    # Embeddings — Gemini primary, local fastembed fallback
    "google-genai>=1.0.0",
    "fastembed>=0.2.0",

    # Browser automation (raw Playwright — no crawl4ai)
    "playwright>=1.60.0",

    # HTTP + HTML parsing
    "httpx>=0.26.0,<0.29",
    "beautifulsoup4>=4.12.0",

    # API server
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",

    # Document parsing
    "pdfplumber>=0.10.0",

    # Web search
    "tavily-python>=0.3.0",
    "duckduckgo-search>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests that require live external services (Supabase, APIs)",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
