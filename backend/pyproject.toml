[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-automation-backend"
version = "0.1.0"
description = "Indian finance content automation backend"
requires-python = ">=3.11"
dependencies = [
    "supabase>=2.3.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "arq>=0.26.1",
    "redis>=5.0.0,<6",
    "anthropic>=0.90.0",
    "google-generativeai>=0.8.0",
    "fastembed>=0.2.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0,<0.29",
    "crawl4ai>=0.4.0,<1.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "PyPDF2>=3.0.0",
    "python-multipart>=0.0.9",
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "tavily-python>=0.3.0",
    "duckduckgo-search>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
    "pytest-cov>=4.1.0",
]
local-embeddings = [
    "sentence-transformers>=4.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests that require live external services (Supabase, APIs)",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
